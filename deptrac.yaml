deptrac:
  paths:
    - ./app/public/wp-content/themes/Impreza-child
  exclude_files:
    - '#.*node_modules.*#'
  analyser:
    types:
      - use
      - file
      - function_call
  layers:
    - name: Templates
      collectors:
        - type: bool
          must:
            - type: directory
              value: 'wp-content/themes/Impreza-child/(page|single|archive|front-page|header|footer)-?.*\.php$'
    - name: WooCommerceOverrides
      collectors:
        - type: directory
          value: 'wp-content/themes/Impreza-child/woocommerce/.*'
    - name: Functions
      collectors:
        - type: directory
          value: 'wp-content/themes/Impreza-child/functions\.php$'
  ruleset: []
  formatters:
    graphviz:
      pointToGroups: true