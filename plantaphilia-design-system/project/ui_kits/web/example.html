<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Plantaphilia · Web Kit Example</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);}
  .pa-hero{
    position:relative;
    height:520px;
    background: url('../../assets/hero-bloom.png') center/cover;
    display:flex;align-items:flex-end;
    box-shadow: var(--shadow-inner-dark);
  }
  .pa-hero::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(7,21,13,0.35) 0%, rgba(7,21,13,0.85) 100%);
  }
  .pa-hero-inner{ position:relative; z-index:1; padding: 0 48px 64px; max-width: 720px; }
  .pa-hero-eyebrow{
    font-size:11px; letter-spacing:0.28em; text-transform:uppercase;
    color: var(--lavender); margin-bottom: 18px;
  }
  .pa-hero h1{
    font-family: var(--serif-display); font-weight: 500;
    font-size: 64px; line-height: 1.05; letter-spacing: -0.015em;
    color: var(--creme); margin: 0 0 14px;
  }
  .pa-hero h1 em{ color: var(--lavender); font-weight: 400; }
  .pa-hero-tag{
    font-family: var(--serif-display); font-style: italic;
    font-size: 19px; color: var(--creme-dim); max-width: 540px;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="components.jsx"></script>

  <script type="text/babel">
    const {useState} = React;
    const {Header, NavPanel, CategoryRail, ProductCard, CartDrawer, Footer} = window.PA;

    const PRODUCTS = [
      { name:"Lord Bute",          latin:"Pelargonium × domesticum", price:"€ 38,00", priceN:38, img:"../../assets/banner.png", badge:"Rarität" },
      { name:"Black Velvet",       latin:"Pelargonium 'Black Velvet'", price:"€ 28,00", priceN:28, img:"../../assets/banner.png" },
      { name:"Mrs. Pollock",       latin:"Pelargonium × hortorum", price:"€ 24,00", priceN:24, img:"../../assets/banner.png", badge:"Neu" },
      { name:"Attar of Roses",     latin:"Pelargonium capitatum", price:"€ 22,00", priceN:22, img:"../../assets/banner.png" },
      { name:"Crystal Palace Gem", latin:"Pelargonium × hortorum", price:"€ 32,00", priceN:32, img:"../../assets/banner.png", sold:true, badge:"Ausverkauft" },
      { name:"Lemon Fancy",        latin:"Pelargonium crispum",     price:"€ 19,00", priceN:19, img:"../../assets/banner.png" },
    ];

    function App(){
      const [cat, setCat] = useState('Alle');
      const [navOpen, setNavOpen] = useState(false);
      const [cartOpen, setCartOpen] = useState(false);
      const [cart, setCart] = useState([]);

      return (
        <>
          <Header
            cartCount={cart.length}
            onMenu={()=>setNavOpen(true)}
            onCart={()=>setCartOpen(true)}
            onSearch={()=>{}}
          />
          <section className="pa-hero">
            <div className="pa-hero-inner">
              <div className="pa-hero-eyebrow">Sammlung · Winter 2026</div>
              <h1>Selten, samtig,<br/><em>aufrichtig botanisch.</em></h1>
              <p className="pa-hero-tag">Pelargonien aus europäischen Schattengärten — kuratiert, etikettiert, versandfertig.</p>
            </div>
          </section>
          <CategoryRail active={cat} onSelect={setCat}/>
          <div className="pa-grid">
            {PRODUCTS.map((p,i)=>(
              <ProductCard key={i} p={p} onAdd={(x)=>setCart([...cart,x])} onOpen={()=>{}}/>
            ))}
          </div>
          <Footer/>
          <NavPanel open={navOpen} onClose={()=>setNavOpen(false)}/>
          <CartDrawer open={cartOpen} items={cart} onClose={()=>setCartOpen(false)} onRemove={(i)=>setCart(cart.filter((_,j)=>j!==i))}/>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
