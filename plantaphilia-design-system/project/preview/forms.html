<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:24px;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);box-sizing:border-box;}
  .f{display:flex;flex-direction:column;gap:14px;max-width:340px;}
  label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--lavender-dim);display:block;margin-bottom:6px;font-weight:500;}
  input{width:100%;background:var(--bg-inky);border:1px solid var(--border-thin);border-bottom:1px solid var(--magenta-soft);color:var(--creme);font-family:var(--sans-body);font-size:14px;padding:12px 14px;box-sizing:border-box;border-radius:2px;outline:none;transition:border-color 180ms;}
  input:focus{border-color:var(--magenta);}
  input::placeholder{color:var(--creme-muted);font-style:italic;}
  .search{position:relative;}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--lavender);width:14px;height:14px;}
  .search input{padding-left:34px;}
</style></head><body>
<div class="f">
  <div><label>E-Mail-Adresse</label><input type="email" placeholder="name@plantaphilia.eu"></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Pelargonium suchen …"></div>
</div>
</body></html>
