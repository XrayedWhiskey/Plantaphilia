<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:24px;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);box-sizing:border-box;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .s{flex:1;min-width:120px;aspect-ratio:1.6;border-radius:2px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--creme);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05);}
  .name{font-weight:500;} .hex{font-family:var(--mono);font-size:10px;opacity:0.75;text-transform:none;letter-spacing:0;}
</style></head><body>
<div class="row">
  <div class="s" style="background:#0f2419;"><span class="name">Bg Deep</span><span class="hex">#0f2419</span></div>
  <div class="s" style="background:#143020;"><span class="name">Bg Surface</span><span class="hex">#143020</span></div>
  <div class="s" style="background:#1a3d29;"><span class="name">Bg Raised</span><span class="hex">#1a3d29</span></div>
  <div class="s" style="background:#07150d;"><span class="name">Bg Inky</span><span class="hex">#07150d</span></div>
</div>
</body></html>
