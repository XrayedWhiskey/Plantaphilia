<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:var(--bg-inky);color:var(--creme);font-family:var(--sans-body);}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--bg-inky);border-bottom:1px solid var(--border-hair);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--lavender-dim);}
  .bar .l{display:flex;gap:18px;align-items:center;}
  .bar .r{display:flex;gap:16px;align-items:center;}
  .bar .r span{cursor:pointer;display:flex;align-items:center;gap:6px;position:relative;}
  .bar .r span:hover{color:var(--creme);}
  .bar svg{width:14px;height:14px;color:var(--lavender);}
  .badge{position:absolute;top:-6px;right:-10px;min-width:14px;height:14px;padding:0 4px;border-radius:999px;background:linear-gradient(135deg,#e03a94,#c4267a);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:0;}
  .mid{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;background:var(--bg-deep);}
  .logo{width:180px;height:auto;filter:brightness(0) invert(1);}
  .hamb{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:6px;}
  .hamb span{display:block;width:28px;height:1px;background:var(--creme);}
</style></head><body>
<div class="bar">
  <div class="l"><span>DE / EN</span></div>
  <div class="r">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg> Suchen</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-8 8-8s8 3.5 8 8"/></svg> Konto</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h3l2.7 11.5a2 2 0 0 0 2 1.5h7.6a2 2 0 0 0 2-1.5L22 8H6"/></svg> Warenkorb<em class="badge" style="font-style:normal;">3</em></span>
  </div>
</div>
<div class="mid">
  <img class="logo" src="../assets/logo.svg" alt="Plantaphilia">
  <div class="hamb"><span></span><span></span><span></span></div>
</div>
</body></html>
