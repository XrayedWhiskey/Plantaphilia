<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:24px;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);box-sizing:border-box;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .s{aspect-ratio:2.2;border-radius:2px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05);}
  .name{font-weight:500;} .hex{font-family:var(--mono);font-size:10px;opacity:0.85;text-transform:none;letter-spacing:0;}
</style></head><body>
<div class="grid">
  <div class="s" style="background:#0f2419;color:#f2e8d5;"><span class="name" style="font-family:var(--serif-display);font-style:italic;font-size:18px;text-transform:none;letter-spacing:0;">Rare & exotic.</span><span class="hex">creme on bg-deep</span></div>
  <div class="s" style="background:#0f2419;color:#d9cdb3;"><span class="name">Body Dim</span><span class="hex">#d9cdb3</span></div>
  <div class="s" style="background:#0f2419;color:#a89d84;"><span class="name">Meta / Caption</span><span class="hex">#a89d84</span></div>
  <div class="s" style="background:#143020;color:#b9a3d4;font-style:italic;font-family:var(--serif-display);"><span class="name" style="font-size:14px;text-transform:none;letter-spacing:0.02em;">P. × hortorum</span><span class="hex" style="font-style:normal;font-family:var(--mono);">amethyst italic</span></div>
  <div class="s" style="background:#143020;color:#7d6a96;"><span class="name">Lavender Dim</span><span class="hex">#7d6a96</span></div>
  <div class="s" style="background:#143020;color:#9c3f7e;font-family:var(--serif-display);"><span class="name" style="font-size:18px;text-transform:none;letter-spacing:0;">€ 48,00</span><span class="hex" style="font-family:var(--mono);">plum-hot price</span></div>
</div>
</body></html>
