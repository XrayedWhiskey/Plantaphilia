<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:24px;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);box-sizing:border-box;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;}
  .cell{text-align:center;}
  .box{width:100%;aspect-ratio:1;background:var(--bg-surface);margin-bottom:6px;box-shadow:var(--shadow-cabinet);}
  .tok{font-family:var(--mono);font-size:10px;color:var(--lavender-dim);}
  .px{font-family:var(--serif-display);font-size:14px;color:var(--creme);}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="box" style="width:8px;margin:0 auto;"></div><div class="px">s-2</div><div class="tok">8px</div></div>
  <div class="cell"><div class="box" style="width:16px;margin:0 auto;"></div><div class="px">s-4</div><div class="tok">16px</div></div>
  <div class="cell"><div class="box" style="width:24px;margin:0 auto;"></div><div class="px">s-5</div><div class="tok">24px</div></div>
  <div class="cell"><div class="box" style="width:48px;margin:0 auto;"></div><div class="px">s-7</div><div class="tok">48px</div></div>
  <div class="cell"><div class="box" style="width:96px;margin:0 auto;"></div><div class="px">s-9</div><div class="tok">96px</div></div>
</div>
</body></html>
