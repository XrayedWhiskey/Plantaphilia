<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:24px;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);box-sizing:border-box;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .s{flex:1;min-width:120px;aspect-ratio:1.6;border-radius:2px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--creme);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);}
  .name{font-weight:500;} .hex{font-family:var(--mono);font-size:10px;opacity:0.8;text-transform:none;letter-spacing:0;}
</style></head><body>
<div class="row">
  <div class="s" style="background:#6b2f5c;"><span class="name">Plum</span><span class="hex">#6b2f5c</span></div>
  <div class="s" style="background:#9c3f7e;"><span class="name">Plum Hot</span><span class="hex">#9c3f7e</span></div>
  <div class="s" style="background:#5a1a2e;"><span class="name">Burgundy</span><span class="hex">#5a1a2e</span></div>
  <div class="s" style="background:#7d5fa5;"><span class="name">Amethyst</span><span class="hex">#7d5fa5</span></div>
  <div class="s" style="background:#1f0f1c;"><span class="name">Berry</span><span class="hex">#1f0f1c</span></div>
  <div class="s" style="background:#8a6f3a;color:#0f2419;"><span class="name">Gold</span><span class="hex">#8a6f3a</span></div>
</div>
</body></html>
