<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:24px;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);box-sizing:border-box;}
  .row{display:flex;gap:18px;align-items:center;}
  .box{flex:1;height:110px;background:var(--bg-surface);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--creme-dim);}
  .b1{border:1px solid var(--border-thin);}
  .b2{box-shadow:var(--shadow-cabinet);}
  .b3{box-shadow:var(--shadow-specimen);}
  .b4{border:1px solid var(--border-gold);}
</style></head><body>
<div class="row">
  <div class="box b1">1px magenta border</div>
  <div class="box b2">shadow-cabinet</div>
  <div class="box b3">shadow-specimen</div>
  <div class="box b4">1px gold border</div>
</div>
</body></html>
