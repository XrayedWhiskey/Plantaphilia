<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);box-sizing:border-box;}
  .wrap{padding:16px 24px;display:flex;flex-direction:column;gap:12px;}
  .logo{display:block;width:220px;height:auto;filter:brightness(0) invert(1) sepia(0.2) saturate(1);}
  .tag{font-family:var(--serif-display);font-style:italic;font-size:17px;color:var(--creme-dim);}
</style></head><body>
<div class="wrap">
  <img class="logo" src="../assets/logo.svg" alt="Plantaphilia">
  <div class="tag">Rare Pelargonien & exotische Raritäten</div>
</div>
</body></html>
