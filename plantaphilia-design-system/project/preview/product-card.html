<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:20px;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);box-sizing:border-box;}
  .card{background:var(--bg-surface);border:1px solid var(--border-thin);padding:0;width:240px;box-shadow:var(--shadow-cabinet);}
  .ph{aspect-ratio:1;background:url('../assets/banner.png') center/cover;}
  .body{padding:16px 18px 20px;}
  .nm{font-family:var(--serif-display);font-size:19px;font-weight:500;color:var(--creme);margin:0;}
  .lt{font-family:var(--serif-display);font-style:italic;font-size:12px;color:var(--lavender);margin:3px 0 14px;letter-spacing:0.01em;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .pr{font-family:var(--serif-display);color:#9c3f7e;font-size:20px;}
  .btn{font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:9px 14px;border:1px solid #9c3f7e;background:transparent;color:#9c3f7e;border-radius:2px;}
</style></head><body>
<div class="card">
  <div class="ph"></div>
  <div class="body">
    <p class="nm">Lord Bute</p>
    <p class="lt">Pelargonium × domesticum</p>
    <div class="row"><span class="pr">€ 38,00</span><span class="btn">In den Warenkorb</span></div>
  </div>
</div>
</body></html>
