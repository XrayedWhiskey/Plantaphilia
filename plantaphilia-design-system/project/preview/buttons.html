<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:24px;background:var(--bg-deep);color:var(--creme);font-family:var(--sans-body);box-sizing:border-box;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .btn-primary{font-family:var(--sans-body);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:13px 22px;border:1px solid #9c3f7e;background:transparent;color:#9c3f7e;border-radius:2px;cursor:pointer;transition:all 220ms;}
  .btn-primary:hover{background:#9c3f7e;color:var(--bg-deep);}
  .btn-filled{font-family:var(--sans-body);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:13px 22px;border:1px solid #9c3f7e;background:#9c3f7e;color:var(--creme);border-radius:2px;cursor:pointer;}
  .btn-secondary{font-family:var(--sans-body);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:13px 22px;border:1px solid #b9a3d4;background:transparent;color:#b9a3d4;border-radius:2px;}
  .btn-ghost{font-family:var(--sans-body);font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;padding:10px 16px;border:none;background:transparent;color:var(--creme-dim);cursor:pointer;}
  .btn-ghost:hover{color:#9c3f7e;}
</style></head><body>
<div class="row">
  <button class="btn-primary">In den Warenkorb</button>
  <button class="btn-filled">Jetzt kaufen</button>
  <button class="btn-secondary">Mehr erfahren</button>
  <button class="btn-ghost">Abbrechen</button>
</div>
</body></html>
