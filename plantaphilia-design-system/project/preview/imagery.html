<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:16px;background:var(--bg-deep);box-sizing:border-box;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .tile{flex:1;min-width:130px;aspect-ratio:2.3;background-size:cover;background-position:center;box-shadow:inset 0 0 60px rgba(0,0,0,0.5);position:relative;}
  .tile::after{content:attr(data-l);position:absolute;bottom:8px;left:10px;font-family:var(--mono);font-size:10px;color:var(--creme-dim);letter-spacing:0.05em;text-shadow:0 1px 4px rgba(0,0,0,0.8);}
</style></head><body>
<div class="row">
  <div class="tile" style="background-image:url('../assets/hero-bloom.png')" data-l="hero-bloom · header"></div>
  <div class="tile" style="background-image:url('../assets/banner.png')" data-l="banner · cards / sections"></div>
  <div class="tile" style="background-image:url('../assets/leaf-texture.png')" data-l="leaf-texture · footer"></div>
</div>
</body></html>
