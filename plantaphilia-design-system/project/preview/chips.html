<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:20px;background:var(--bg-deep);font-family:var(--sans-body);box-sizing:border-box;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;padding:8px 16px;border:1px solid var(--border-thin);background:transparent;color:var(--creme-dim);border-radius:999px;cursor:pointer;transition:all 160ms;}
  .chip:hover{border-color:#9c3f7e;color:var(--creme);}
  .chip.active{background:#6b2f5c;border-color:#9c3f7e;color:var(--creme);}
</style></head><body>
<div class="chips">
  <span class="chip active">Alle</span>
  <span class="chip">Angel</span>
  <span class="chip">Edelpelargonien</span>
  <span class="chip">Duftpelargonien</span>
  <span class="chip">Fingerpelargonien</span>
  <span class="chip">Rosenknospige</span>
  <span class="chip">Sternblüher</span>
  <span class="chip">Wildarten</span>
  <span class="chip">Miniatur</span>
  <span class="chip">Zonartic</span>
</div>
</body></html>
