<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <div class="r"><span class="label">Display</span><span class="spec" style="font-size:58px;line-height:1;letter-spacing:-0.02em;">Plantaphilia</span></div>

  <div class="r"><span class="label">H2 / 48</span><span class="spec" style="font-size:30px;font-weight:500;">Edelpelargonien</span></div>
  <div class="r"><span class="label">Italic</span><span class="spec" style="font-size:22px;font-style:italic;color:var(--creme-dim);">&amp; exotische Raritäten</span></div>
