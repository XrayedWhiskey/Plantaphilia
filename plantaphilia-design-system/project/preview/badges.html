<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:24px;background:var(--bg-deep);font-family:var(--sans-body);box-sizing:border-box;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .badge{font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:5px 10px;border-radius:2px;}
  .b-new{background:#9c3f7e;color:var(--creme);}
  .b-rare{border:1px solid var(--gold-dark);color:var(--gold-dark);background:transparent;}
  .b-out{background:#5a1a2e;color:var(--creme-dim);}
  .b-cart{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:linear-gradient(135deg,#9c3f7e,#6b2f5c);color:#fff;font-size:11px;font-weight:700;font-family:var(--sans-body);}
  .tag{font-family:var(--serif-display);font-style:italic;font-size:13px;color:#b9a3d4;padding:4px 10px;border-left:1px solid var(--border-gold);}
</style></head><body>
<div class="row">
  <span class="badge b-new">Neu</span>
  <span class="badge b-rare">Rarität</span>
  <span class="badge b-out">Ausverkauft</span>
  <span class="b-cart">3</span>
  <span class="tag">Sammlerstück</span>
</div>
</body></html>
