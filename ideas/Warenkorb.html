<!DOCTYPE html>
<html lang="de" data-accent="amethyst" data-density="compact" data-viewport="desktop">
<head>
<meta charset="utf-8">
<title>Warenkorb · Plantaphilia</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="ui_kits/web/styles.css">
<link rel="stylesheet" href="cart-checkout.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--bg-deep); color: var(--creme); font-family: var(--sans-body); }
  body { overflow-x: hidden; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ui_kits/web/components.jsx"></script>
  <script type="text/babel" src="cart-checkout.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const {useState, useEffect} = React;
    const {Header, NavPanel, CartDrawer, Footer} = window.PA;
    const {Steps, CartLines, Addons, Summary, Empty, SAMPLE_CART, ADDONS, fmt} = window.CC;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "viewport": "desktop",
      "state": "filled"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [navOpen, setNavOpen] = useState(false);
      const [items, setItems] = useState(SAMPLE_CART);
      const [addons, setAddons] = useState({ care: true });
      const [note, setNote] = useState('');
      const [voucher, setVoucher] = useState('');

      // Reflect viewport
      useEffect(() => {
        document.documentElement.setAttribute('data-viewport', t.viewport);
      }, [t.viewport]);

      // Sync state with tweak (filled vs empty)
      useEffect(() => {
        if (t.state === 'empty') setItems([]);
        else if (items.length === 0) setItems(SAMPLE_CART);
      }, [t.state]);

      function setQty(key, qty) {
        setItems((arr) => arr.map((i) => i.key === key ? { ...i, qty } : i));
      }
      function remove(key) {
        setItems((arr) => arr.filter((i) => i.key !== key));
      }
      function toggleAddon(key) {
        setAddons((a) => ({ ...a, [key]: !a[key] }));
      }

      const totalCount = items.reduce((s, i) => s + i.qty, 0);
      const isEmpty = items.length === 0;

      return (
        <>
          <Header
            cartCount={totalCount}
            onMenu={() => setNavOpen(true)}
            onCart={() => {}}
            onSearch={() => {}}
          />

          <main className="cc-page" data-screen-label="Warenkorb">
            <div className="cc-wrap">
              <Steps current="cart" />

              <header className="cc-pagehead">
                <div className="cc-pagehead-l">
                  <div className="eyebrow">· Ihr Schaubeet ·</div>
                  <h1>Warenkorb<em>.</em></h1>
                </div>
                {!isEmpty && (
                  <div className="cc-pagehead-r">
                    {totalCount} {totalCount === 1 ? 'Pflanze' : 'Pflanzen'} aus unserem Gewächshaus · für Sie reserviert für die nächsten <a href="#">60 Minuten</a>.
                  </div>
                )}
              </header>

              {isEmpty ? (
                <Empty />
              ) : (
                <div className="cc-grid">
                  <div className="cc-main">
                    <div className="cc-sect-head">
                      <h2><em>{totalCount}</em> &nbsp;Position{totalCount === 1 ? '' : 'en'}</h2>
                      <span className="meta">Reserviert · 60 Min</span>
                    </div>

                    <CartLines items={items} onQty={setQty} onRemove={remove} />

                    <Addons
                      selected={addons}
                      onToggle={toggleAddon}
                      note={note}
                      onNote={setNote}
                    />

                    <a className="cc-continue" href="Produktseite.html">
                      <span className="arr">←</span> Weiter im Schaubeet stöbern
                    </a>
                  </div>

                  <div className="cc-aside">
                    <Summary
                      items={items}
                      addons={addons}
                      voucher={voucher}
                      onVoucher={setVoucher}
                      ctaLabel="Zur Kasse"
                      ctaHref="Kasse.html"
                      stamp="Tafel · Warenkorb"
                    />
                  </div>
                </div>
              )}
            </div>
          </main>

          <Footer />

          <NavPanel open={navOpen} onClose={() => setNavOpen(false)} />

          <TweaksPanel title="Tweaks">
            <TweakSection label="Anzeige" />
            <TweakRadio
              label="Vorschau"
              value={t.viewport}
              options={['desktop','mobile']}
              onChange={(v) => setTweak('viewport', v)}
            />
            <TweakSection label="Warenkorb-Zustand" />
            <TweakRadio
              label="Status"
              value={t.state}
              options={[{value:'filled', label:'Befüllt'},{value:'empty', label:'Leer'}]}
              onChange={(v) => setTweak('state', v)}
            />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
