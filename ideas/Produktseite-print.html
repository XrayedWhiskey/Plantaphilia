<!DOCTYPE html>
<html lang="de" data-accent="amethyst" data-density="compact" data-viewport="desktop">
<head>
<meta charset="utf-8">
<title>Lord Bute · Plantaphilia · Print</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="ui_kits/web/styles.css">
<link rel="stylesheet" href="product-page.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--bg-deep); color: var(--creme); font-family: var(--sans-body); }
  body { overflow-x: hidden; }

  /* ── Print rules ─────────────────────────────────────────────── */
  @page {
    size: A4 portrait;
    margin: 0;
  }

  @media print {
    html, body {
      background: var(--bg-deep) !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    *, *::before, *::after {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      transition: none !important;
      animation: none !important;
    }
    /* Hide things that don't belong in print */
    .twk-panel,
    .pa-nav,
    .pa-cart,
    .pdp-zoom-hint,
    .pa-hamb,
    .pa-iconbtn,
    .pa-fav,
    .pdp-cta,
    .pdp-qty,
    .pdp-buy-row,
    .pdp-write-wrap,
    .pdp-reviews-more,
    .pdp-more-btn { display: none !important; }

    /* Page breaks */
    .pdp-hero { break-before: avoid; }
    .pdp-steckbrief-wrap,
    .pdp-lore,
    .pdp-reviews,
    .pdp-related { break-before: page; }
    .pa-footer { break-before: page; }

    /* Avoid mid-element page breaks */
    .pdp-plaque,
    .pdp-iconscale,
    .pdp-table-wrap,
    .pdp-review-row,
    .pa-card,
    .pdp-lore-pull { break-inside: avoid; }

    /* Hero must fit on first page */
    .pdp-hero {
      padding: 28px 32px !important;
      gap: 36px !important;
    }
    .pdp-main-img { box-shadow: none !important; }
    .pdp-title { font-size: 40px !important; }
    .pdp-price { font-size: 28px !important; }

    /* Steckbrief: tighter */
    .pdp-steckbrief-wrap { padding: 40px 32px !important; }
    .pdp-iconscale { padding: 28px 32px !important; box-shadow: none !important; }
    .pdp-iconscale-grid { gap: 24px 48px !important; }
    .pdp-steckbrief-heading h2 { font-size: 28px !important; }

    .pdp-lore { padding: 40px 48px !important; }
    .pdp-lore-body h2 { font-size: 28px !important; }

    .pdp-reviews { padding: 40px 48px !important; }
    .pdp-reviews-head h2 { font-size: 28px !important; }
    .pdp-review-row-quote { font-size: 15px !important; }

    .pdp-related { padding: 40px 32px !important; }
    .pdp-related-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 18px !important; }
    .pdp-related-head h2 { font-size: 26px !important; }

    .pdp-crumb { padding: 12px 32px !important; }
    .pa-midbar { padding: 14px 32px !important; }
    .pa-topbar { display: none !important; }
    .pa-divider { display: none !important; }

    /* Footer compact */
    .pa-footer-top { padding: 0 !important; }
    .pa-footer-veil { padding: 56px 32px !important; min-height: 0 !important; }
    .pa-footer-quote { font-size: 22px !important; }
    .pa-footer-main { padding: 32px 32px 20px !important; gap: 24px !important; }
    .pa-footer-bottom { padding: 12px 32px !important; }

    /* Remove transforms that confuse print layout */
    .pa-card:hover,
    .pdp-cta:hover,
    .pdp-thumb:hover { transform: none !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ui_kits/web/components.jsx"></script>
  <script type="text/babel" src="product-page.jsx"></script>

  <script type="text/babel">
    const {useState, useEffect} = React;
    const {Header, Footer} = window.PA;
    const {Crumb, Gallery, Info, Steckbrief, Lore, Reviews, Related, PRODUCTS} = window.PDP;

    const LOCKED = {
      plant: 'lord-bute',
      accent: 'amethyst',
      density: 'compact',
      steckbrief: 'icons',
      gallery: 'vertical',
    };

    function App() {
      useEffect(() => {
        document.documentElement.setAttribute('data-accent', LOCKED.accent);
        document.documentElement.setAttribute('data-density', LOCKED.density);
      }, []);

      const product = PRODUCTS[LOCKED.plant];

      return (
        <>
          <Header cartCount={0} onMenu={()=>{}} onCart={()=>{}} onSearch={()=>{}} />
          <Crumb name={product.name} />
          <section className="pdp-hero">
            <Gallery product={product} layout={LOCKED.gallery} />
            <Info product={product} accent={LOCKED.accent} />
          </section>
          <Steckbrief product={product} variant={LOCKED.steckbrief} />
          <Lore product={product} />
          <Reviews product={product} auth="guest" />
          <Related product={product} onAdd={()=>{}} />
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

    // Auto-print once fonts + Babel + DOM have settled
    (async () => {
      try {
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }
      } catch (e) {}
      await new Promise(r => setTimeout(r, 500));
      window.print();
    })();
  </script>
</body>
</html>
